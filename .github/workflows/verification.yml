name: verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: pip install -r verification/requirements.txt
      - name: Main-theorem verification battery
        working-directory: verification
        run: python3 verify.py
      - name: Arithmetic application regression
        working-directory: verification
        run: python3 verify_arithmetic.py
